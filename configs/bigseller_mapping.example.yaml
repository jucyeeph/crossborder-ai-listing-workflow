# BigSeller 字段映射配置
# 格式: 
#   列名:
#     source: JSON路径 (使用 . 分隔, [] 表示数组遍历)
#     required: 是否必填
#     default: 默认值 (当 source 无值时使用)

Category_ID:
  target_column: 分类ID*
  source: product.optimized.category_id
  required: true
  default: 100350

Product_Name:
  target_column: 产品名称*
  source: product.optimized.title
  required: true

Supplier_Link:
  target_column: 供应商链接
  source: product.raw.supplier_info.link
  required: false

Parent_SKU:
  target_column: Parent SKU
  source: product.optimized.parent_sku
  required: false

Description:
  target_column: 产品描述*
  source: product.optimized.description
  required: true

Variant_Name_1:
  target_column: 变种名称1
  source: product.optimized.skus[].variant_name_1
  required: false

Variant_Option_1:
  target_column: 变种选项1
  source: product.optimized.skus[].variant_value_1
  required: false

Variant_Name_2:
  target_column: 变种名称2
  source: product.optimized.skus[].variant_name_2
  required: false

Variant_Option_2:
  target_column: 变种选项2
  source: product.optimized.skus[].variant_value_2
  required: false

SKU:
  target_column: SKU
  source: product.optimized.skus[].sku_id
  required: false

Stock:
  target_column: 库存*
  source: product.optimized.skus[].stock
  required: true
  default: 100

Price:
  target_column: 价格*
  source: product.pricing.skus[].suggested_sale_price
  required: true

Promo_Price:
  target_column: 促销价
  source: product.pricing.skus[].campaign_price
  required: false

Variant_Image:
  target_column: 变种图
  source: uploaded_image_urls.skus[{sku_id}]
  required: false

Main_Image:
  target_column: 产品主图*
  source: uploaded_image_urls.main[0]
  required: true

Detail_Image_1:
  target_column: 产品附属图1
  source: uploaded_image_urls.detail[0]
  required: false

Detail_Image_2:
  target_column: 产品附属图2
  source: uploaded_image_urls.detail[1]
  required: false

Weight:
  target_column: 重量（g）*
  source: product.optimized.weight
  required: true
  default: 200

Length:
  target_column: 长（cm）
  source: product.optimized.length
  required: false
  default: 10

Width:
  target_column: 宽（cm）
  source: product.optimized.width
  required: false
  default: 10

Height:
  target_column: 高（cm）
  source: product.optimized.height
  required: false
  default: 10

Condition:
  target_column: 物品状况
  source: product.optimized.condition
  required: false
  default: 1
