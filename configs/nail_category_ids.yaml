# 美甲产品 Shopee PH 分类ID 速查表
# 来源: Beauty > Hand, Foot & Nail Care > Nail Care
# 数据采集时间: 2026-06-15
# 使用方法: 在 product.optimized.json 的 category_id 字段填入对应ID

nail_care:
  base_top_coat:
    id: "101615"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Base & Top Coat"
    use_for:
      - 底胶
      - 封层胶
      - Top Coat
      - Base Coat

  nail_polish:
    id: "102029"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Nail Polish"
    use_for:
      - 甲油胶
      - 猫眼胶
      - 功能胶
      - 美甲胶
      - Gel Nail Polish
      - Cat Eye Gel
      - UV Gel

  nail_polish_remover:
    id: "102030"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Nail Polish Remover"
    use_for:
      - 卸甲液
      - 洗甲水
      - Nail Remover

  nail_treatment:
    id: "102031"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Nail Treatment"
    use_for:
      - 护甲油
      - 修复胶
      - Nail Treatment

  artificial_nail:
    id: "102032"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Artificial Nail"
    use_for:
      - 假指甲
      - 甲片
      - Press-on Nails

  nail_art_sticker:
    id: "102033"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Nail Art & Sticker"
    use_for:
      - 美甲贴纸
      - 美甲饰品
      - Nail Sticker
      - Nail Decal

  manicure_tools:
    id: "102034"
    path: "Beauty > Hand, Foot & Nail Care > Nail Care > Manicure Tools & Devices"
    use_for:
      # 中文关键词
      - 美甲工具
      - 美甲灯
      - 打磨机
      - 磁铁
      - 磁铁棒
      - 双头磁铁
      - 吸玻璃珠磁铁
      - 猫眼磁铁
      - 磁铁工具
      - 指甲修剪工具
      - 美甲套装工具
      - 指甲锉
      - 推皮棒
      - 甲油胶工具
      # 英文关键词
      - Nail Lamp
      - UV Lamp
      - LED Lamp
      - Nail Drill
      - Nail Buffer
      - Nail File
      - Cuticle Tool
      - Cuticle Pusher
      - Manicure Tool
      - Manicure Set
      - Cat Eye Magnet
      - Magnet Wand
      - Magnet Stick
      - Dual Head Magnet
      - Ball Tip Magnet
      - Ball Magnet
      - Glass Bead Magnet
      - Magnetic Wand
      - Nail Magnet
      - Magnet Tool

# -------------------------------------------------------
# 分类识别规则（AI 自动分类时必须遵守）
# -------------------------------------------------------
# 规则 1：优先匹配 use_for 列表中的关键词，匹配即使用对应 ID
# 规则 2：工具/设备类产品（如磁铁棒、灯、打磨机）必须归入 manicure_tools (102034)
#         即使产品名称中含有"猫眼"等胶类词汇，只要主体是工具，就用 102034
# 规则 3：胶类产品（甲油胶、猫眼胶、底胶等液体/膏体）归入 nail_polish (102029)
# 规则 4：无法匹配时使用 default_nail_category_id
# 规则 5：判断依据优先级：1688原始分类 > 产品名称关键词 > 产品描述关键词
# -------------------------------------------------------
# 判断示例：
#   "双头圆球磁铁棒" → 工具 → manicure_tools → 102034 ✅
#   "猫眼胶 #36"     → 胶类 → nail_polish    → 102029 ✅
#   "底胶"           → 胶类 → base_top_coat  → 101615 ✅
# -------------------------------------------------------

# 默认分类（通用美甲胶类产品）
default_nail_category_id: "102029"
